name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker Application
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '72.62.27.45' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is empty or missing! Please ensure you added it under: GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

          mkdir -p ~/.ssh

          python3 - << 'PYEOF'
          import os, base64

          raw = os.environ.get("SSH_KEY", "").strip()

          # If user pasted base64-encoded key
          try:
              decoded = base64.b64decode(raw).decode('utf-8')
              if "PRIVATE KEY" in decoded:
                  raw = decoded
          except Exception:
              pass

          # Replace literal \n characters if newlines were flattened
          if "\\n" in raw:
              raw = raw.replace("\\n", "\n")

          # Normalize CRLF to LF
          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"

          with open("/home/runner/.ssh/deploy_key", "w") as f:
              f.write(raw)
          PYEOF

          chmod 600 ~/.ssh/deploy_key

          # Verify key structure
          ssh-keygen -l -f ~/.ssh/deploy_key || {
            echo "::error::The SSH key could not be parsed by ssh-keygen. Please check that the full private key was pasted into VPS_SSH_KEY."
            exit 1
          }

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" << 'EOF' | tee deploy_output.log
            set -e
            echo "=== Deploying edu_api on VPS ==="
            cd /root/edu_api

            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Rebuilding and starting containers..."
            docker compose up -d --build

            echo "Cleaning dangling images..."
            docker image prune -f

            echo "Waiting for container to settle..."
            sleep 5

            echo "Verifying container status..."
            docker compose ps

            echo "=== Recent container logs (last 200 lines) ==="
            docker compose logs --no-color --tail=200
          EOF

      - name: Publish logs to job summary
        if: always()
        run: |
          {
            echo "## Deploy & container logs"
            echo '```'
            cat deploy_output.log 2>/dev/null || echo "(no log output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag errors found in logs
        if: always()
        run: |
          if [ ! -f deploy_output.log ]; then
            echo "No log file found, skipping error scan."
            exit 0
          fi

          if grep -iE "error|exception|unhandled|fatal|traceback" deploy_output.log > errors_found.txt; then
            echo "::warning::Errors detected in deploy/container logs - see the job summary for full output."
            while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::${esc}"
            done < errors_found.txt
          else
            echo "No error-level lines found in logs."
          fi
