name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker Application
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '72.62.27.45' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is empty or missing! Please ensure you added it under: GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

          mkdir -p ~/.ssh

          python3 - << 'PYEOF'
          import os, base64

          raw = os.environ.get("SSH_KEY", "").strip()

          # If user pasted base64-encoded key
          try:
              decoded = base64.b64decode(raw).decode('utf-8')
              if "PRIVATE KEY" in decoded:
                  raw = decoded
          except Exception:
              pass

          # Replace literal \n characters if newlines were flattened
          if "\\n" in raw:
              raw = raw.replace("\\n", "\n")

          # Normalize CRLF to LF
          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"

          with open("/home/runner/.ssh/deploy_key", "w") as f:
              f.write(raw)
          PYEOF

          chmod 600 ~/.ssh/deploy_key

          # Verify key structure
          ssh-keygen -l -f ~/.ssh/deploy_key || {
            echo "::error::The SSH key could not be parsed by ssh-keygen. Please check that the full private key was pasted into VPS_SSH_KEY."
            exit 1
          }

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            echo "=== Deploying edu_api on VPS ==="
            cd /root/edu_api

            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Rebuilding and starting containers..."
            docker compose up -d --build

            echo "Cleaning dangling images..."
            docker image prune -f

            echo "Verifying container status..."
            docker compose ps
          EOF
